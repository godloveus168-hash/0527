<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台海大 Soothing Hiking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes walk-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-3deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-8px) rotate(3deg); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }

    @keyframes flutter {
      0%, 100% { transform: scaleY(1) rotate(0deg); }
      50% { transform: scaleY(0.4) rotate(15deg); }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: spin-slow 3s linear infinite;
    }

    .walking-anim {
      animation: walk-bob 0.6s ease-in-out infinite;
    }

    .idle-anim {
      animation: walk-bob 3s ease-in-out infinite;
    }

    .butterfly-float {
      animation: float 4s ease-in-out infinite;
    }
    
    .butterfly-flutter {
      animation: flutter 0.2s ease-in-out infinite;
    }

    .butterfly-flutter-fast {
      animation: flutter 0.08s ease-in-out infinite;
    }

    .scene-transition {
      transition: opacity 1s ease-in-out, transform 1s ease-in-out, background-color 1s ease-in-out;
    }
  </style>
</head>
<body class="m-0 p-0 font-sans overflow-hidden bg-slate-900 select-none">

  <!-- 點擊與互動區域 -->
  <div id="app-container" class="relative w-full h-screen cursor-pointer">
    
    <!-- 動態背景漸層 -->
    <div id="bg-layer" class="absolute inset-0 bg-gradient-to-b from-sky-200 via-blue-100 to-green-200 scene-transition"></div>

    <!-- 太陽/雲朵點綴 -->
    <div class="absolute top-10 right-20 opacity-60 pointer-events-none">
      <svg id="sun-svg" width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" fill="#fef08a" />
      </svg>
    </div>

    <!-- 背景場景層 -->
    <div id="scenes-container" class="absolute inset-0 w-full h-full scene-transition" style="transform: translateX(0%);">
      
      <!-- 場景 0: 人文社會科學院 & 櫻花亭 -->
      <div id="scene-0" class="scene absolute inset-0 scene-transition opacity-100" style="visibility: visible;">
        <div class="absolute inset-0 flex items-end justify-between px-10 pb-32 pointer-events-none">
          <div class="relative w-64 h-64 -ml-10">
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-lg">
              <circle cx="100" cy="80" r="60" fill="#fbcfe8" opacity="0.9"/>
              <circle cx="60" cy="100" r="50" fill="#f9a8d4" opacity="0.9"/>
              <circle cx="140" cy="100" r="50" fill="#f9a8d4" opacity="0.9"/>
              <path d="M50 120 L100 80 L150 120 Z" fill="#78350f" />
              <path d="M40 120 L160 120 L150 130 L50 130 Z" fill="#92400e" />
              <rect x="70" y="130" width="8" height="50" fill="#451a03" />
              <rect x="122" y="130" width="8" height="50" fill="#451a03" />
              <rect x="50" y="180" width="100" height="20" fill="#d4d4d8" />
            </svg>
          </div>
          <div class="relative w-80 h-96 -mr-10 opacity-90">
            <svg viewBox="0 0 200 300" class="w-full h-full drop-shadow-xl">
              <rect x="20" y="50" width="160" height="250" fill="#e4e4e7" rx="5" />
              <rect x="10" y="40" width="180" height="20" fill="#a1a1aa" rx="2" />
              <rect x="20" y="280" width="160" height="20" fill="#71717a" />
              <!-- 窗戶使用內聯生成 -->
              <rect x="40" y="80" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="72" y="80" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="104" y="80" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="136" y="80" width="20" height="20" fill="#bae6fd" rx="2" />
              <rect x="40" y="112" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="72" y="112" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="104" y="112" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="136" y="112" width="20" height="20" fill="#bae6fd" rx="2" />
              <rect x="40" y="144" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="72" y="144" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="104" y="144" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="136" y="144" width="20" height="20" fill="#bae6fd" rx="2" />
              <rect x="40" y="176" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="72" y="176" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="104" y="176" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="136" y="176" width="20" height="20" fill="#bae6fd" rx="2" />
              <rect x="40" y="208" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="72" y="208" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="104" y="208" width="20" height="20" fill="#bae6fd" rx="2" /><rect x="136" y="208" width="20" height="20" fill="#bae6fd" rx="2" />
              <rect x="75" y="240" width="50" height="40" fill="#3f3f46" />
              <text x="100" y="70" font-size="10" text-anchor="middle" fill="#3f3f46" font-weight="bold">人文社會科學院</text>
            </svg>
          </div>
        </div>
      </div>

      <!-- 場景 1: 夢泉廣場 -->
      <div id="scene-1" class="scene absolute inset-0 scene-transition opacity-0" style="visibility: hidden;">
        <div class="absolute inset-0 flex items-end justify-center pb-24 pointer-events-none opacity-80">
          <svg viewBox="0 0 300 200" class="w-96 h-64 drop-shadow-lg">
            <ellipse cx="150" cy="170" rx="120" ry="25" fill="#bae6fd" stroke="#7dd3fc" stroke-width="4"/>
            <path d="M130 170 L170 170 L160 120 L140 120 Z" fill="#d4d4d8" />
            <path d="M120 120 L180 120 L180 110 L120 110 Z" fill="#a1a1aa" />
            <path d="M150 110 Q 110 50 100 80" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" />
            <path d="M150 110 Q 150 30 150 70" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" />
            <path d="M150 110 Q 190 50 200 80" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" />
            <circle cx="100" cy="80" r="3" fill="#e0f2fe" />
            <circle cx="150" cy="65" r="4" fill="#e0f2fe" />
            <circle cx="200" cy="80" r="3" fill="#e0f2fe" />
          </svg>
        </div>
      </div>

      <!-- 場景 2: 龍崗生態步道 -->
      <div id="scene-2" class="scene absolute inset-0 scene-transition opacity-0" style="visibility: hidden;">
        <div class="absolute inset-0 flex items-end justify-around pb-32 pointer-events-none">
          <!-- 生成樹木 -->
          <svg viewBox="0 0 100 200" class="w-40 h-64 opacity-90" style="transform: scale(0.9)">
            <rect x="40" y="100" width="20" height="100" fill="#5c4033" /><circle cx="50" cy="70" r="50" fill="#15803d" /><circle cx="20" cy="90" r="30" fill="#166534" /><circle cx="80" cy="90" r="30" fill="#166534" />
          </svg>
          <svg viewBox="0 0 100 200" class="w-40 h-64 opacity-90" style="transform: scale(1.1)">
            <rect x="40" y="100" width="20" height="100" fill="#5c4033" /><circle cx="50" cy="70" r="50" fill="#15803d" /><circle cx="20" cy="90" r="30" fill="#166534" /><circle cx="80" cy="90" r="30" fill="#166534" />
          </svg>
          <svg viewBox="0 0 100 200" class="w-40 h-64 opacity-90" style="transform: scale(0.8)">
            <rect x="40" y="100" width="20" height="100" fill="#5c4033" /><circle cx="50" cy="70" r="50" fill="#15803d" /><circle cx="20" cy="90" r="30" fill="#166534" /><circle cx="80" cy="90" r="30" fill="#166534" />
          </svg>
          <svg viewBox="0 0 100 200" class="w-40 h-64 opacity-90" style="transform: scale(1.2)">
            <rect x="40" y="100" width="20" height="100" fill="#5c4033" /><circle cx="50" cy="70" r="50" fill="#15803d" /><circle cx="20" cy="90" r="30" fill="#166534" /><circle cx="80" cy="90" r="30" fill="#166534" />
          </svg>
          <svg viewBox="0 0 100 200" class="w-40 h-64 opacity-90" style="transform: scale(1.0)">
            <rect x="40" y="100" width="20" height="100" fill="#5c4033" /><circle cx="50" cy="70" r="50" fill="#15803d" /><circle cx="20" cy="90" r="30" fill="#166534" /><circle cx="80" cy="90" r="30" fill="#166534" />
          </svg>
        </div>
      </div>

      <!-- 場景 3: 海堤與貯木池 -->
      <div id="scene-3" class="scene absolute inset-0 scene-transition opacity-0" style="visibility: hidden;">
        <div class="absolute inset-0 flex items-end justify-center pb-20 pointer-events-none">
          <svg viewBox="0 0 800 200" class="w-full h-48 opacity-80">
            <path d="M0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100 L 800 200 L 0 200 Z" fill="#0284c7" />
            <path d="M0 120 Q 100 140 200 120 T 400 120 T 600 120 T 800 120 L 800 200 L 0 200 Z" fill="#0369a1" opacity="0.7"/>
            <path d="M50 180 L70 150 L90 180 Z" fill="#94a3b8" /><path d="M150 180 L170 150 L190 180 Z" fill="#94a3b8" />
            <path d="M250 180 L270 150 L290 180 Z" fill="#94a3b8" /><path d="M350 180 L370 150 L390 180 Z" fill="#94a3b8" />
            <path d="M450 180 L470 150 L490 180 Z" fill="#94a3b8" /><path d="M550 180 L570 150 L590 180 Z" fill="#94a3b8" />
            <path d="M650 180 L670 150 L690 180 Z" fill="#94a3b8" /><path d="M750 180 L770 150 L790 180 Z" fill="#94a3b8" />
            <path d="M600 90 Q 650 40 700 90 Z" fill="#334155" opacity="0.6"/>
          </svg>
        </div>
      </div>

      <!-- 場景 4: 小艇碼頭夕陽 -->
      <div id="scene-4" class="scene absolute inset-0 scene-transition opacity-0" style="visibility: hidden;">
        <div class="absolute inset-0 flex items-end justify-center pb-24 pointer-events-none">
          <svg viewBox="0 0 600 300" class="w-full h-72">
            <circle cx="300" cy="150" r="60" fill="#fde047" opacity="0.9" filter="blur(4px)" />
            <rect x="0" y="250" width="600" height="50" fill="#1e293b" />
            <path d="M100 250 L80 200 L150 200 L180 250 Z" fill="#0f172a" />
            <rect x="110" y="170" width="4" height="30" fill="#0f172a" />
            <path d="M400 250 L420 220 L480 220 L490 250 Z" fill="#0f172a" />
          </svg>
        </div>
      </div>

    </div> <!-- End scenes-container -->

    <!-- 地面層 -->
    <div id="ground-layer" class="absolute bottom-0 h-24 bg-green-600 scene-transition shadow-inner" style="transform: translateX(0%); width: 120%; left: -10%;"></div>

    <!-- 蝴蝶 -->
    <div class="absolute inset-0 pointer-events-none z-30">
      <div class="absolute butterfly-float" style="top: 20%; left: 30%; animation-delay: 0s;">
        <div class="butterfly butterfly-flutter" style="animation-delay: 0s;">
          <svg width="30" height="30" viewBox="0 0 100 100" class="drop-shadow-md">
            <path d="M50 50 C 20 10, 10 40, 50 50 C 10 60, 20 90, 50 50 C 80 90, 90 60, 50 50 C 90 40, 80 10, 50 50 Z" fill="#fbbf24" opacity="0.8" />
            <ellipse cx="50" cy="50" rx="3" ry="15" fill="#4b5563" />
          </svg>
        </div>
      </div>
      <div class="absolute butterfly-float" style="top: 35%; left: 60%; animation-delay: 1s;">
        <div class="butterfly butterfly-flutter" style="animation-delay: 1s;">
          <svg width="30" height="30" viewBox="0 0 100 100" class="drop-shadow-md">
            <path d="M50 50 C 20 10, 10 40, 50 50 C 10 60, 20 90, 50 50 C 80 90, 90 60, 50 50 C 90 40, 80 10, 50 50 Z" fill="#60a5fa" opacity="0.8" />
            <ellipse cx="50" cy="50" rx="3" ry="15" fill="#4b5563" />
          </svg>
        </div>
      </div>
      <div class="absolute butterfly-float" style="top: 25%; left: 50%; animation-delay: 2s;">
        <div class="butterfly butterfly-flutter" style="animation-delay: 2s;">
          <svg width="30" height="30" viewBox="0 0 100 100" class="drop-shadow-md">
            <path d="M50 50 C 20 10, 10 40, 50 50 C 10 60, 20 90, 50 50 C 80 90, 90 60, 50 50 C 90 40, 80 10, 50 50 Z" fill="#f472b6" opacity="0.8" />
            <ellipse cx="50" cy="50" rx="3" ry="15" fill="#4b5563" />
          </svg>
        </div>
      </div>
      <div class="absolute butterfly-float" style="top: 45%; left: 40%; animation-delay: 0.5s;">
        <div class="butterfly butterfly-flutter" style="animation-delay: 0.5s;">
          <svg width="30" height="30" viewBox="0 0 100 100" class="drop-shadow-md">
            <path d="M50 50 C 20 10, 10 40, 50 50 C 10 60, 20 90, 50 50 C 80 90, 90 60, 50 50 C 90 40, 80 10, 50 50 Z" fill="#a78bfa" opacity="0.8" />
            <ellipse cx="50" cy="50" rx="3" ry="15" fill="#4b5563" />
          </svg>
        </div>
      </div>
    </div>

    <!-- 角色：兩位好朋友 -->
    <div class="absolute bottom-16 left-1/2 transform -translate-x-1/2">
      <div id="friends" class="relative z-20 flex space-x-6 idle-anim">
        <!-- 朋友 A -->
        <svg width="80" height="120" viewBox="0 0 100 150" class="drop-shadow-lg">
          <circle cx="50" cy="30" r="20" fill="#fcd34d" />
          <rect x="35" y="55" width="30" height="45" rx="10" fill="#3b82f6" />
          <rect id="leg-a-left" x="40" y="100" width="8" height="40" rx="4" fill="#1e3a8a" />
          <rect x="52" y="100" width="8" height="40" rx="4" fill="#1e3a8a" />
          <circle cx="42" cy="25" r="3" fill="#1e3a8a" />
          <circle cx="58" cy="25" r="3" fill="#1e3a8a" />
          <path d="M45 35 Q50 40 55 35" stroke="#1e3a8a" stroke-width="2" fill="none" />
        </svg>

        <!-- 朋友 B -->
        <svg width="75" height="110" viewBox="0 0 100 150" class="drop-shadow-lg mt-2">
          <circle cx="50" cy="30" r="18" fill="#f87171" />
          <rect x="35" y="52" width="30" height="40" rx="10" fill="#10b981" />
          <rect x="40" y="92" width="8" height="35" rx="4" fill="#064e3b" />
          <rect id="leg-b-right" x="52" y="92" width="8" height="35" rx="4" fill="#064e3b" />
          <circle cx="42" cy="25" r="3" fill="#451a03" />
          <circle cx="58" cy="25" r="3" fill="#451a03" />
          <path d="M45 35 Q50 42 55 35" stroke="#451a03" stroke-width="2" fill="none" />
        </svg>
      </div>
    </div>

    <!-- UI 介面層 -->
    <div class="absolute top-0 left-0 w-full p-6 text-center z-50 pointer-events-none drop-shadow-md text-slate-800">
      <h1 class="text-4xl font-extrabold tracking-widest text-white mb-2" style="text-shadow: 0 2px 4px rgba(0,0,0,0.4);">
        台海大 Soothing Hiking
      </h1>
      <p id="ui-title" class="text-xl font-bold text-white bg-black/20 inline-block px-4 py-1 rounded-full backdrop-blur-sm" style="text-shadow: 0 1px 2px rgba(0,0,0,0.5);">
        人文社會科學院 & 櫻花亭
      </p>
      <p id="ui-subtitle" class="mt-2 text-sm text-white drop-shadow-md">旅程的起點，微風吹拂櫻花</p>
    </div>

    <!-- 底部操作提示與進度條 -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50 pointer-events-none">
      <div class="bg-white/80 backdrop-blur-md px-6 py-3 rounded-2xl shadow-lg border border-white/50 text-center">
        <p class="font-bold text-slate-700 mb-2">
          👇 請按下 <kbd class="bg-slate-200 px-2 py-1 rounded mx-1 text-slate-600">空白鍵 (Space)</kbd> 或點擊螢幕漫步
        </p>
        
        <div class="flex items-center justify-center space-x-2">
          <span class="text-xs font-bold text-slate-500">當前景點</span>
          <div id="progress-container" class="flex space-x-1">
            <div class="progress-dot h-2 w-6 rounded-full transition-all duration-300 bg-slate-300"></div>
            <div class="progress-dot h-2 w-6 rounded-full transition-all duration-300 bg-slate-300"></div>
            <div class="progress-dot h-2 w-6 rounded-full transition-all duration-300 bg-slate-300"></div>
            <div class="progress-dot h-2 w-6 rounded-full transition-all duration-300 bg-slate-300"></div>
            <div class="progress-dot h-2 w-6 rounded-full transition-all duration-300 bg-slate-300"></div>
          </div>
          <span class="text-xs font-bold text-slate-500">下一站</span>
        </div>
        <p id="step-count" class="text-xs text-slate-400 mt-1">總步數：0 步</p>
      </div>
    </div>

  </div> <!-- End app-container -->

  <script>
    // === 海大校園場景資料 ===
    const NTOU_SCENES = [
      {
        title: "人文社會科學院 & 櫻花亭",
        subtitle: "旅程的起點，微風吹拂櫻花",
        bgGradient: "from-sky-200 via-blue-100 to-green-200",
        groundColor: "bg-green-600"
      },
      {
        title: "夢泉廣場",
        subtitle: "聽著潺潺流水聲，感受校園活力",
        bgGradient: "from-blue-300 via-cyan-100 to-emerald-100",
        groundColor: "bg-stone-400"
      },
      {
        title: "龍崗生態步道",
        subtitle: "漫步在翠綠林蔭間，大口呼吸芬多精",
        bgGradient: "from-green-200 via-emerald-300 to-green-500",
        groundColor: "bg-yellow-800"
      },
      {
        title: "海堤與貯木池",
        subtitle: "海浪拍打消波塊，眺望無際的太平洋",
        bgGradient: "from-cyan-300 via-blue-400 to-blue-600",
        groundColor: "bg-slate-300"
      },
      {
        title: "小艇碼頭夕陽",
        subtitle: "浪漫的橘紅晚霞，結束今天美好的漫步",
        bgGradient: "from-orange-400 via-red-400 to-purple-500",
        groundColor: "bg-slate-800"
      }
    ];

    // === 狀態變數 ===
    let pressCount = 0;
    let isMoving = false;
    let moveTimeout = null;

    // === DOM 元素 ===
    const bgLayer = document.getElementById('bg-layer');
    const scenesContainer = document.getElementById('scenes-container');
    const groundLayer = document.getElementById('ground-layer');
    const friends = document.getElementById('friends');
    const legALeft = document.getElementById('leg-a-left');
    const legBRight = document.getElementById('leg-b-right');
    const sunSvg = document.getElementById('sun-svg');
    const butterflies = document.querySelectorAll('.butterfly');
    const uiTitle = document.getElementById('ui-title');
    const uiSubtitle = document.getElementById('ui-subtitle');
    const progressDots = document.querySelectorAll('.progress-dot');
    const stepCountText = document.getElementById('step-count');

    // === 更新畫面邏輯 ===
    function updateDOM() {
      const sceneIndex = Math.floor(pressCount / 5) % NTOU_SCENES.length;
      const currentScene = NTOU_SCENES[sceneIndex];
      const progressInScene = pressCount % 5;
      const bgOffsetX = -(progressInScene * 3);

      // 更新背景與地面顏色
      bgLayer.className = `absolute inset-0 bg-gradient-to-b ${currentScene.bgGradient} scene-transition`;
      groundLayer.className = `absolute bottom-0 h-24 ${currentScene.groundColor} scene-transition shadow-inner`;

      // 視差位移
      scenesContainer.style.transform = `translateX(${bgOffsetX}%)`;
      groundLayer.style.transform = `translateX(${bgOffsetX * 0.5}%)`;

      // 切換場景顯示
      NTOU_SCENES.forEach((_, idx) => {
        const sceneEl = document.getElementById(`scene-${idx}`);
        if (sceneEl) {
          if (idx === sceneIndex) {
            sceneEl.style.opacity = '1';
            sceneEl.style.visibility = 'visible';
          } else {
            sceneEl.style.opacity = '0';
            sceneEl.style.visibility = 'hidden';
          }
        }
      });

      // 更新文字
      uiTitle.textContent = currentScene.title;
      uiSubtitle.textContent = currentScene.subtitle;
      stepCountText.textContent = `總步數：${pressCount} 步`;

      // 更新進度條
      progressDots.forEach((dot, idx) => {
        if (idx < progressInScene) {
          dot.classList.remove('bg-slate-300');
          dot.classList.add('bg-green-500');
        } else {
          dot.classList.remove('bg-green-500');
          dot.classList.add('bg-slate-300');
        }
      });
    }

    // === 動作觸發邏輯 ===
    function handleAction() {
      pressCount++;
      isMoving = true;

      // 套用動作動畫
      friends.classList.remove('idle-anim');
      friends.classList.add('walking-anim');
      legALeft.classList.add('animate-pulse');
      legBRight.classList.add('animate-pulse');
      sunSvg.classList.add('animate-spin-slow');
      
      butterflies.forEach(b => {
        b.classList.remove('butterfly-flutter');
        b.classList.add('butterfly-flutter-fast');
      });

      updateDOM();

      if (moveTimeout) clearTimeout(moveTimeout);

      // 停止按壓後 800ms 恢復靜止狀態
      moveTimeout = setTimeout(() => {
        isMoving = false;
        friends.classList.remove('walking-anim');
        friends.classList.add('idle-anim');
        legALeft.classList.remove('animate-pulse');
        legBRight.classList.remove('animate-pulse');
        sunSvg.classList.remove('animate-spin-slow');
        
        butterflies.forEach(b => {
          b.classList.remove('butterfly-flutter-fast');
          b.classList.add('butterfly-flutter');
        });
      }, 800);
    }

    // === 事件監聽器 ===
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); // 防止網頁往下捲動
        handleAction();
      }
    });

    document.getElementById('app-container').addEventListener('click', handleAction);

    // 初始渲染
    updateDOM();

  </script>
</body>
</html>
